repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        pass_filenames: false
        always_run: true

      - id: clippy
        name: cargo clippy
        entry: cargo clippy -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        always_run: true
